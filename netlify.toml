[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Seed photos never change — let browsers and the CDN keep them.
[[headers]]
  for = "/seed-gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
